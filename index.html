<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My Music</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#fff;--fg:#111;--mut:#666;--acc:#0a6;--sel:#dff5ea}
@media (prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--mut:#999;--acc:#3d9;--sel:#1d3a2c}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.3 sans-serif}
h1{font-size:15px;margin:0;padding:5px 8px;background:var(--acc);color:#fff}
#now{padding:5px 8px;border-bottom:1px solid var(--mut)}
#t{display:block;font-weight:bold;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#st{font-size:13px;color:var(--mut)}
#bar{height:5px;background:var(--sel);margin-top:3px}
#fill{height:5px;width:0;background:var(--acc)}
#btn{display:flex;gap:4px;padding:4px 8px}
#btn button{flex:1;padding:8px 0;font-size:15px;border:1px solid var(--acc);background:var(--sel);color:var(--fg)}
ul{list-style:none;margin:0;padding:0}
li{padding:8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
li.sel{background:var(--sel);font-weight:bold}
li.cur:before{content:"\25B6 ";color:var(--acc)}
#help{font-size:12px;color:var(--mut);padding:6px 8px}
</style>
</head>
<body>
<h1>My Music</h1>
<div id="now"><span id="t">No song</span><span id="st">Loading list...</span><div id="bar"><div id="fill"></div></div></div>
<div id="btn"><button id="bp">&laquo;</button><button id="bt">Play</button><button id="bn">&raquo;</button><button id="br">Refresh</button></div>
<ul id="l"></ul>
<div id="help">Keys: Up/Down choose &middot; OK or 5 play-pause &middot; 4/6 prev-next &middot; 2/8 volume &middot; 0 refresh list</div>
<div id="dbg" style="font-size:11px;color:#999;padding:0 8px">key: -</div>
<audio id="a" preload="auto"></audio>
<script>
/* Optional: only set these if auto-detect fails (not on github.io) */
var GH_USER = "", GH_REPO = "", FOLDER = "songs";
(function(){
var a=document.getElementById('a'),L=document.getElementById('l'),T=document.getElementById('t'),S=document.getElementById('st'),F=document.getElementById('fill'),BT=document.getElementById('bt'),D=document.getElementById('dbg');
var songs=[],sel=0,cur=-1;
var EXT=/\.(mp3|m4a|aac|ogg|wav|opus)$/i;
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function pretty(n){var s=n.replace(EXT,'').replace(/_/g,' ');return s}
function draw(){var h='',i;if(!songs.length)h='<li>No songs found</li>';
for(i=0;i<songs.length;i++)h+='<li data-i="'+i+'" class="'+(i===sel?'sel ':'')+(i===cur?'cur':'')+'">'+esc(songs[i].n)+'</li>';
L.innerHTML=h;var s=L.querySelector('.sel');if(s&&s.scrollIntoView)s.scrollIntoView(false)}
function play(i){if(!songs.length)return;if(i<0)i=songs.length-1;if(i>=songs.length)i=0;
sel=i;cur=i;a.src=songs[i].u;T.textContent=songs[i].n;S.textContent='Loading...';
var p=a.play();if(p&&p.catch)p.catch(function(){S.textContent='Cannot play'});draw()}
function toggle(){if(cur<0){play(sel);return}if(a.paused)a.play();else a.pause()}
a.onplaying=function(){S.textContent='Playing  vol '+Math.round(a.volume*10);BT.textContent='Pause'};
a.onpause=function(){S.textContent='Paused';BT.textContent='Play'};
a.onerror=function(){S.textContent='Error: cannot play'};
a.onended=function(){play(cur+1)};
a.ontimeupdate=function(){if(a.duration)F.style.width=(100*a.currentTime/a.duration)+'%'};
function vol(d){a.volume=Math.max(0,Math.min(1,Math.round((a.volume+d)*10)/10));S.textContent=(a.paused?'Paused':'Playing')+'  vol '+Math.round(a.volume*10)}
function where(){var h=location.hostname,u=GH_USER,r=GH_REPO;
if(!u&&/\.github\.io$/.test(h)){u=h.split('.')[0];r=location.pathname.split('/')[1]||(u+'.github.io')}
return u&&r?{u:u,r:r}:null}
function load(){var w=where();if(!w){S.textContent='Set GH_USER and GH_REPO in file';return}
S.textContent='Loading list...';
var x=new XMLHttpRequest();x.open('GET','https://api.github.com/repos/'+w.u+'/'+w.r+'/contents/'+FOLDER,true);
x.onload=function(){try{var r=JSON.parse(x.responseText),i;if(!r.length){S.textContent='No songs in '+FOLDER;return}
var out=[];for(i=0;i<r.length;i++)if(r[i].type==='file'&&EXT.test(r[i].name))out.push({n:pretty(r[i].name),u:FOLDER+'/'+encodeURIComponent(r[i].name)});
out.sort(function(p,q){return p.n.toLowerCase()<q.n.toLowerCase()?-1:1});
songs=out;try{localStorage.setItem('kp_songs',JSON.stringify(out))}catch(e){}
S.textContent=songs.length+' songs'}catch(e){S.textContent='List failed (folder missing?)'}draw()};
x.onerror=function(){S.textContent='Offline: using saved list';draw()};x.send()}
try{songs=JSON.parse(localStorage.getItem('kp_songs')||'[]')}catch(e){}
document.getElementById('bp').onclick=function(){play(cur-1)};
document.getElementById('bn').onclick=function(){play(cur+1)};
document.getElementById('bt').onclick=toggle;
document.getElementById('br').onclick=load;
L.onclick=function(e){var el=e.target,i=el&&el.getAttribute&&el.getAttribute('data-i');if(i!==null&&i!==undefined&&i!==''){play(parseInt(i,10))}};
function isK(e){var k=e.key,c=e.keyCode||e.which;
return k==='ArrowDown'||k==='Down'||k==='ArrowUp'||k==='Up'||k==='Enter'||k==='ArrowRight'||k==='Right'||k==='ArrowLeft'||k==='Left'||/^[0-9]$/.test(k||'')||c===13||c===38||c===40||c===37||c===39||(c>=48&&c<=57)||(c>=96&&c<=105)||c===179}
function onkey(e){e=e||window.event;var k=e.key,c=e.keyCode||e.which,n=songs.length;
if(isK(e)&&e.preventDefault)e.preventDefault();
if(e.type!=='keydown')return false;
D.textContent='key='+k+' code='+c;
try{
if(k==='ArrowDown'||k==='Down'||c===40){sel=n?(sel+1)%n:0;draw()}
else if(k==='ArrowUp'||k==='Up'||c===38){sel=n?(sel-1+n)%n:0;draw()}
else if(k==='Enter'||c===13){if(sel===cur)toggle();else play(sel)}
else if(k==='5'||c===53||c===101||c===179){toggle()}
else if(k==='ArrowRight'||k==='Right'||k==='6'||c===39||c===54||c===102){play(cur+1)}
else if(k==='ArrowLeft'||k==='Left'||k==='4'||c===37||c===52||c===100){play(cur-1)}
else if(k==='2'||c===50||c===98){vol(0.1)}
else if(k==='8'||c===56||c===104){vol(-0.1)}
else if(k==='0'||c===48||c===96){load()}
}catch(err){D.textContent='ERR '+err.message}
return false}
document.onkeydown=onkey;document.onkeypress=onkey;document.onkeyup=onkey;
draw();load();
})();
</script>
</body>
</html>
